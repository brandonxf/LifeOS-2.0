<svg xmlns="http://www.w3.org/2000/svg" class="play" viewBox="240 90 1050 690" role="img" aria-label="Logo Lifeos">
  <defs>
    <radialGradient id="lg-glow"><stop offset="0" stop-color="#37e779" stop-opacity="0.28"/><stop offset="1" stop-color="#37e779" stop-opacity="0"/></radialGradient>
    <style>
      .trace{stroke:#37e779;stroke-width:36;stroke-opacity:0;fill-opacity:1;stroke-dasharray:1;stroke-dashoffset:0}
      .dot{transform-box:fill-box;transform-origin:center}
      .glow{transform-box:fill-box;transform-origin:center;opacity:.35}
      @keyframes trace{0%{stroke-dashoffset:1;stroke-opacity:1;fill-opacity:0}62%{stroke-dashoffset:0;stroke-opacity:1;fill-opacity:0}100%{stroke-dashoffset:0;stroke-opacity:0;fill-opacity:1}}
      @keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
      @keyframes rise{from{opacity:0;transform:translateY(-520px)}to{opacity:1;transform:translateY(0)}}
      @keyframes bloom{0%{opacity:0;transform:scale(.6)}55%{opacity:1;transform:scale(1.05)}100%{opacity:.35;transform:scale(1)}}
      .play .trace{animation:trace 1.5s cubic-bezier(.6,.05,.25,1) both;animation-delay:var(--d,0s)}
      .play .dot{animation:pop .55s cubic-bezier(.3,1.4,.5,1) both;animation-delay:1.15s}
      .play .ltr{animation:rise .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,1.3s)}
      .play .glow{animation:bloom 1.6s ease-out both;animation-delay:1.2s}
      @media (prefers-reduced-motion:reduce){.play .trace,.play .dot,.play .ltr,.play .glow{animation:none!important}}
    </style>
  </defs>
